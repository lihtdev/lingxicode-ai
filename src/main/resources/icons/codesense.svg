<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 定义统一的胖花瓣模板 -->
    <ellipse id="petal" cx="200" cy="200" rx="16" ry="88" fill="#6C70E6" />
  </defs>

  <style>
    .rays {
    transform-origin: 200px 200px;
    animation: spin 30s linear infinite;
    }
    @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
    }
  </style>

  <!-- 光线组：12条等角等距胖花瓣 -->
  <g class="rays">
    <use href="#petal" transform="rotate(0 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(30 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(60 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(90 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(120 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(150 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(180 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(210 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(240 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(270 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(300 200 200) translate(0 -110)" />
    <use href="#petal" transform="rotate(330 200 200) translate(0 -110)" />
  </g>

  <!-- 中心白色小圆 -->
  <circle cx="200" cy="200" r="24" fill="#FFFFFF" />
</svg>